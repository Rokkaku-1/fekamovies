# Repositorio completo: el código de la aplicación está en outputs.
[build]
  base = "outputs"
  command = "node scripts/build.cjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dmca"
  to = "/dmca.html"
  status = 200
