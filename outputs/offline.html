<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>Sin conexión · FekaMovies</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #050507;
        --text: #f5f5f7;
        --accent: #b7a9ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: radial-gradient(ellipse at 50% 100%, #211735, var(--background) 70%);
        color: var(--text);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 460px;
      }
      h1 {
        font-size: clamp(32px, 7vw, 56px);
        letter-spacing: -0.035em;
      }
      p {
        color: #c5c3d0;
        line-height: 1.7;
      }
      button {
        min-height: 48px;
        padding: 12px 26px;
        margin-top: 20px;
        border: 0;
        border-radius: 99px;
        background: var(--text);
        font: 600 16px system-ui;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>FekaMovies</p>
      <h1>Sin conexión</h1>
      <p>No tenemos una copia guardada de esta página. Conéctate para explorar nuevas historias.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
